@if (initializer.isLoading() || organizationService.organizationDataLoading()) {
<app-bootstrapper
  [message]="
    initializer.isLoading() ? 'Loading Data' : 'Switching organization…'
  "
/>
}@else {
<div class="page-container">
  @if (!isErrorPage()) {
  <nav-bar />
  }
  <main class="content centralized">
    <router-outlet />
  </main>
  <app-footer />
</div>
}
